.menu-wrap { position: relative; }
.menu {

.segmented { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.seg { height: 24px; padding: 0 11px; font-size: 12.5px; color: var(--text-dim); }

.chip {

}
.chip .dot {

}
.chip.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
.chip.on .dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.chip.wide { width: 100%; justify-content: flex-start; height: 30px; }

.field.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); flex: 0 0 auto; }

/* ---------- workspace ---------- */

.workspace { flex: 1 1 auto; display: flex; min-height: 0; }

.panel {
  background: var(--panel);
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  transition: width .4s cubic-bezier(.22, .85, .25, 1);
}
.panel.left { width: 214px; border-right: 1px solid var(--line); }
.panel.right { width: 244px; border-left: 1px solid var(--line); }
.panel.left.collapsed, .panel.right.collapsed { width: 48px; }

.panel.left > .panel-body { width: 214px; }
.panel.right > .panel-body { width: 244px; }
.panel > .panel-body {
  transition: opacity .24s ease, transform .4s cubic-bezier(.22, .85, .25, 1);
}
.panel.left.collapsed > .panel-body { opacity: 0; transform: translateX(-26px); pointer-events: none; }
.panel.right.collapsed > .panel-body { opacity: 0; transform: translateX(26px); pointer-events: none; }

.panel-head { gap: 6px; }
.panel-label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  transition: opacity .2s ease .14s;
}
.panel.collapsed .panel-label { flex: 0 0 0; opacity: 0; transition-delay: 0s; }
.panel.collapsed .panel-head { justify-content: center; padding: 0 6px; gap: 0; }

.panel-toggle {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel-2);
  color: var(--text-dim);
  cursor: pointer;
  box-shadow: 0 1px 1px rgba(20, 28, 45, .04);
}
.panel-toggle:hover {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  color: var(--accent);
}
.panel-toggle:active { transform: translateY(1px); box-shadow: none; }
/* 注意：旋转要加在 <svg> 上。加在 SVG 内部的 <path> 上会以坐标原点为旋转中心，图形会被转出视口 */
.panel-toggle svg { transition: transform .4s cubic-bezier(.22, .85, .25, 1); }
.panel.left.collapsed .panel-toggle svg { transform: rotate(180deg); }
/* 右侧面板：展开时箭头指向右侧（收起方向），收起时指回左侧 */
.panel.right.collapsed .panel-toggle svg { transform: rotate(180deg); }

/* 收起后竖排显示面板名字 */
.panel-rail-label {
  display: none;
  margin: 12px auto 0;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--text-dim);

.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  height: 34px; padding: 0 8px 0 12px;
  font-size: 12px; font-weight: 600; color: var(--text-dim);

  border-bottom: 1px solid var(--line);
}

.panel-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 10px; }
.panel-body::-webkit-scrollbar { width: 9px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 2px solid var(--panel); }

.section { margin-bottom: 14px; }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 600; color: var(--text-dim);
  letter-spacing: .4px; margin-bottom: 7px;
}
.section-head.mt { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }

.search {

}
.search:focus { border-color: var(--accent); background: var(--panel); }

.shape-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }

.shape-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 8px 4px 7px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel-2); cursor: grab;
  font-size: 11px; color: var(--text-dim);
  transition: border-color .12s, background .12s, color .12s;
}
.shape-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.shape-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.stack { display: flex; flex-direction: column; gap: 6px; }

.mini {

.mini.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.mini.primary:hover { filter: brightness(1.06); background: var(--accent); }

.rows { display: flex; flex-direction: column; gap: 6px; }
.field { display: flex; align-items: center; gap: 8px; }
.field > span { flex: 0 0 50px; font-size: 12px; color: var(--text-dim); white-space: nowrap; }

input[type="number"], input[type="text"], select {
  height: 26px; min-width: 0;
  padding: 0 6px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel-2);

}
input[type="number"] { width: 100%; font-variant-numeric: tabular-nums; }
input[type="text"] { flex: 1 1 auto; }

.row-inline { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }

/* ---------- canvas ---------- */

.canvas-wrap {

  min-width: 0;
  background: var(--canvas-bg);

  touch-action: none;

#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: var(--canvas-bg); }

.canvas-wrap[data-cursor="default"] #board { cursor: default; }

.node-shape { transition: filter .12s; }

.edge-label[data-label] { pointer-events: auto; cursor: move; }
.edge-label-bg[data-label] { pointer-events: auto; cursor: move; }

.sel-outline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 3; pointer-events: none; vector-effect: non-scaling-stroke; }
.hover-outline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: .5; pointer-events: none; vector-effect: non-scaling-stroke; }

.handle {
  fill: var(--ui-handle); stroke: var(--accent); stroke-width: 1.6;

  cursor: crosshair; vector-effect: non-scaling-stroke;
  transition: r .1s;

.anchor-dot { fill: var(--port); opacity: .9; pointer-events: none; }

.inline-editor {

  background: color-mix(in srgb, var(--accent) 8%, transparent);

.msg { color: var(--text-dim); }

@media (max-width: 900px) {
  .panel.left { width: 172px; }

  <header class="topbar">

      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">

<script>
/* geom.js —— 纯几何计算 / 形状库 / 文本排版。不依赖 DOM，可在 Node 中直接单测。 */
(function (factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (typeof window !== 'undefined') { (window.FD = window.FD || {}).geom = api; }
})(function () {
  'use strict';

  /* ---------------- 基础工具 ---------------- */

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function round2(v) { return Math.round(v * 100) / 100; }

  function f(v) {
    var r = Math.round(v * 100) / 100;
    return Object.is(r, -0) ? 0 : r;
  }

  var seq = 0;
  function uid(prefix) {
    seq += 1;
    return (prefix || 'id') + '_' + Date.now().toString(36).slice(-4) + seq.toString(36);
  }

  function dist(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }

  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ---------------- 文本度量 ---------------- */

  var measureFn = null;

  /** 注入真实测量函数（浏览器里用 canvas measureText）；不注入则用近似宽度。 */
  function setMeasurer(fn) { measureFn = fn; }

  function textWidth(str, fontSize, bold) {
    if (!str) return 0;
    if (measureFn) return measureFn(str, fontSize, bold);
    var w = 0;
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      var code = str.charCodeAt(i);
      if (code >= 0x2e80) w += 1;
      else if (ch === ' ') w += 0.3;
      else if (code >= 0x41 && code <= 0x5a) w += 0.63;
      else if (/[iljt.,;:'!|]/.test(ch)) w += 0.3;
      else w += 0.53;
    }
    return w * fontSize * (bold ? 1.05 : 1);
  }

  var CJK = /[\u2e80-\u9fff\u3000-\u303f\uf900-\ufaff\uff00-\uffef]/;

  function tokenize(line) {
    var out = [];
    var buf = '';
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (CJK.test(ch)) {
        if (buf) { out.push(buf); buf = ''; }
        out.push(ch);
      } else if (ch === ' ') {
        buf += ch;
        out.push(buf);
        buf = '';
      } else {
        buf += ch;
      }
    }
    if (buf) out.push(buf);
    return out;
  }

  /** 按宽度换行，返回行数组。 */
  function wrapText(text, maxWidth, fontSize, bold) {
    var raw = String(text == null ? '' : text).split('\n');

      if (!para) { lines.push(''); continue; }

    var gapY = Math.max(b.y - (a.y + a.h), a.y - (b.y + b.h));

    if (gapX > 0 && gapY <= 0) return dx >= 0 ? 'r' : 'l';
    if (gapY > 0 && gapX <= 0) return dy >= 0 ? 'b' : 't';
    if (gapX > 0 && gapY > 0) {
      var rx = gapX / Math.max(1, (a.w + b.w) / 2);
      var ry = gapY / Math.max(1, (a.h + b.h) / 2);
      if (rx >= ry) return dx >= 0 ? 'r' : 'l';
      return dy >= 0 ? 'b' : 't';
    }
    var nx = Math.abs(dx) / Math.max(1, a.w);
    var ny = Math.abs(dy) / Math.max(1, a.h);
    if (nx >= ny) return dx >= 0 ? 'r' : 'l';
    return dy >= 0 ? 'b' : 't';
  }

  function resSide(node, other, port) {
    return isFixed(port) ? port : chooseSide(node, other);
  }

  function stub(p, side, amount) {
    var d = dirOf(side);
    var k = amount == null ? STUB : amount;
    return { x: p.x + d.x * k, y: p.y + d.y * k };
  }

  /** 端口点沿"垂直方向"偏移，用于让多根平行箭头分开；会夹在组件边长范围内。 */
  function offPort(node, side, off) {
    var p = G.portPoint(node, side);
    if (!off) return p;
    var limit = (side === 't' || side === 'b' ? node.w : node.h) / 2 - 8;
    var d = G.clamp(off, -Math.max(0, limit), Math.max(0, limit));
    if (side === 't' || side === 'b') return { x: p.x + d, y: p.y };
    return { x: p.x, y: p.y + d };
  }

  /**
   * 端口该往哪一侧偏移。
   * 两端端口朝向相同时（都在上/都在下…），两条线要"各自向外扩"才能嵌套；
   * 两端端口相对时（一左一右），则要"整体同向平移"。
   */
  function outwardSign(node, other, side) {
    if (side === 't' || side === 'b') {
      return (node.x + node.w / 2) >= (other.x + other.w / 2) ? 1 : -1;
    }
    return (node.y + node.h / 2) >= (other.y + other.h / 2) ? 1 : -1;
  }

  /**
   * 多条箭头是否属于"同一组"。
   * 只有用同一对端口、方向相反的两根才算真正的双向箭头；
   * 一边连左边、一边连右边这种属于两条互不相干的箭头，不能凑成一对（否则端口会被偏移出错位）。
   */
  function groupKeyOf(edge, nodes) {
    if (!edge || !edge.from || !edge.to || !edge.from.node || !edge.to.node) return null;
    if (edge.from.node === edge.to.node) return null;
    var a = nodes[edge.from.node], b = nodes[edge.to.node];
    if (!a || !b) return null;
    var sa = isFixed(edge.from.port) ? edge.from.port : chooseSide(a, b);
    var sb = isFixed(edge.to.port) ? edge.to.port : chooseSide(b, a);
    var k1 = a.id + '\u0001' + sa + '\u0001' + b.id + '\u0001' + sb;
    var k2 = b.id + '\u0001' + sb + '\u0001' + a.id + '\u0001' + sa;
    return k1 < k2 ? k1 : k2;
  }

  /**
   * 计算每根箭头的平行偏移量。
   * 同一方向的多根箭头自动错开；一对双向箭头在开启「分开」时各偏半个间距。
   */
  function edgeLayout(edges, nodes) {
    var groups = {}, order = {};
    nodes = nodes || {};
    (edges || []).forEach(function (e) {
      if (!e.from || !e.to || !e.from.node || !e.to.node) return;
      if (e.from.node === e.to.node) return;
      var key = groupKeyOf(e, nodes);
      if (!key) return;
      if (!groups[key]) { groups[key] = []; order[key] = true; }
      groups[key].push(e);
    });
    var out = {};
    Object.keys(order).forEach(function (key) {
      var list = groups[key];
      var byDir = {};
      var dirOrder = [];
      list.forEach(function (e) {
        var dk = e.from.node + '\u0000' + e.to.node;
        if (!byDir[dk]) { byDir[dk] = []; dirOrder.push(dk); }
        byDir[dk].push(e);
      });
      // 组内顺序号：单侧约束时用它把中间段一层层错开
      var slot = 0, slots = {};
      dirOrder.forEach(function (dk) { byDir[dk].forEach(function (e) { slots[e.id] = slot++; }); });

      list.forEach(function (e) { out[e.id] = { offset: 0, slot: slots[e.id] }; });

      var separate = false;
      list.forEach(function (e) { if ((e.style && e.style.biMode) === 'separate') separate = true; });

      dirOrder.forEach(function (dk) {
        var bucket = byDir[dk];
        bucket.forEach(function (e, i) {
          out[e.id].offset = bucket.length > 1 ? (i - (bucket.length - 1) / 2) * PARALLEL_GAP : 0;
        });
      });
      if (separate && dirOrder.length === 2 &&
        byDir[dirOrder[0]].length === 1 && byDir[dirOrder[1]].length === 1) {
        out[byDir[dirOrder[0]][0].id].offset = -PARALLEL_GAP / 2;
        out[byDir[dirOrder[1]][0].id].offset = PARALLEL_GAP / 2;
      }
    });
    return out;
  }

  /** 终点/起点箭头需要的最短直线段，避免箭头压在转折点上。 */
  function requiredStub(edge, tailMin) {
    var sw = (edge && edge.style && edge.style.strokeWidth) || 1.8;
    var arrowLen = 6 * sw;
    var min = tailMin == null ? 16 : tailMin;
    return Math.max(STUB, min, arrowLen + TAIL_GAP);
  }

  /**
   * 转折点的可用区间。
   * 两个端口相向时取"中间那段"；同向（都在上/在下/都在左/都在右）时是一侧开放，
   * 这时需要一个兜底边界，否则两条线的中间段会落在同一高度上重叠。
   */
  function bendWindow(anchorA, dirA, anchorB, dirB, gap) {
    var lo = -Infinity, hi = Infinity;
    if (dirA < 0) hi = Math.min(hi, anchorA - gap); else lo = Math.max(lo, anchorA + gap);
    if (dirB < 0) hi = Math.min(hi, anchorB - gap); else lo = Math.max(lo, anchorB + gap);
    if (lo > hi) {
      lo = Math.min(anchorA, anchorB) + gap;
      hi = Math.max(anchorA, anchorB) - gap;
    }
    if (lo > hi) { var mid = (anchorA + anchorB) / 2; lo = mid; hi = mid; }
    var tightHigh = isFinite(hi), tightLow = isFinite(lo);
    if (!tightLow) lo = Math.min(anchorA, anchorB) - 600;
    if (!tightHigh) hi = Math.max(anchorA, anchorB) + 600;
    return { min: lo, max: hi, tightLow: tightLow, tightHigh: tightHigh };
  }

  /** 单侧开放时的默认位置：沿自由方向一层层铺开，形成嵌套走线。 */
  function oneSidedPos(win, slot) {
    if (win.tightHigh && !win.tightLow) return win.max - slot * PARALLEL_GAP;
    if (win.tightLow && !win.tightHigh) return win.min + slot * PARALLEL_GAP;
    return null;
  }

  function clampBend(value, range) {
    return G.clamp(value, range.min, range.max);
  }

  /* ---------------- 避让组件 ---------------- */

  function segmentsIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
    function cross(ax, ay, bx, by) { return ax * by - ay * bx; }
    var d1 = cross(x4 - x3, y4 - y3, x1 - x3, y1 - y3);
    var d2 = cross(x4 - x3, y4 - y3, x2 - x3, y2 - y3);
    var d3 = cross(x2 - x1, y2 - y1, x3 - x1, y3 - y1);
    var d4 = cross(x2 - x1, y2 - y1, x4 - x1, y4 - y1);
    return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
      ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
  }

  function segmentHitsRect(p, q, r) {
    if (Math.max(p.x, q.x) < r.x || Math.min(p.x, q.x) > r.x + r.w ||
      Math.max(p.y, q.y) < r.y || Math.min(p.y, q.y) > r.y + r.h) return false;
    if (G.pointInRect(p.x, p.y, r) || G.pointInRect(q.x, q.y, r)) return true;
    var e = [
      [r.x, r.y, r.x + r.w, r.y], [r.x + r.w, r.y, r.x + r.w, r.y + r.h],
      [r.x + r.w, r.y + r.h, r.x, r.y + r.h], [r.x, r.y + r.h, r.x, r.y]
    ];
    for (var i = 0; i < 4; i++) {
      if (segmentsIntersect(p.x, p.y, q.x, q.y, e[i][0], e[i][1], e[i][2], e[i][3])) return true;
    }
    return false;
  }

  /** 折线是否穿过任何一个组件矩形。 */
  function polylineHits(pts, rects) {
    if (!rects || !rects.length) return false;
    for (var i = 1; i < pts.length; i++) {
      for (var k = 0; k < rects.length; k++) {
        if (segmentHitsRect(pts[i - 1], pts[i], rects[k])) return true;
      }
    }
    return false;
  }

  /** 两条折线是否相交（用于挑一个不会和同伴撞上的错开方向）。 */
  function polylineCrosses(p, q) {
    return crossCount(p, q) > 0;
  }

  /** 两条折线的交点个数。 */
  function crossCount(p, q) {
    var n = 0;
    for (var i = 1; i < p.length; i++) {
      for (var j = 1; j < q.length; j++) {
        if (segmentsIntersect(p[i - 1].x, p[i - 1].y, p[i].x, p[i].y,
          q[j - 1].x, q[j - 1].y, q[j].x, q[j].y)) n++;
      }
    }
    return n;
  }

  /** 收集需要避开的组件（排除连线两端的组件）。 */
  function obstaclesFor(edge, nodes) {
    var skipA = edge.from && edge.from.node, skipB = edge.to && edge.to.node;
    var out = [];
    for (var k in nodes) {
      if (!Object.prototype.hasOwnProperty.call(nodes, k)) continue;
      if (k === skipA || k === skipB) continue;
      var n = nodes[k];
      if (!n) continue;
      out.push(G.expandRect(n, OBSTACLE_PAD));
    }
    return out;
  }

  /** 全部组件（含连线两端）的外扩矩形，供寻路时避免折回自己身上。 */
  function allRectsOf(nodes) {
    var out = [];
    for (var k in nodes) {
      if (!Object.prototype.hasOwnProperty.call(nodes, k)) continue;
      if (nodes[k]) out.push(G.expandRect(nodes[k], OBSTACLE_PAD));
    }
    return out;
  }

  function insetRect(r, d) {
    return { x: r.x + d, y: r.y + d, w: r.w - d * 2, h: r.h - d * 2 };
  }

  /**
   * 稀疏网格上的 A* 寻路：在"绕得开"的前提下找一条正交折线。
   * 候选网格线取自两端点与各组件的外扩边界，代价里加了转弯惩罚，走线不会碎成锯齿。
   */
  // 同一对组件共用同一条中心线路径（缓存），否则两根箭头会各自找到不同的通道
  var routeCache = {};
  var routeCacheCount = 0;

  function cachedCenterRoute(cacheKey, from, to, rects) {
    var cached = routeCache[cacheKey];
    if (cached !== undefined) return cached;
    if (routeCacheCount > 400) { routeCache = {}; routeCacheCount = 0; }
    var path = gridRoute(from.x, from.y, to.x, to.y, rects);
    routeCache[cacheKey] = path || null;
    routeCacheCount++;
    return routeCache[cacheKey];
  }

  function gridRoute(sx, sy, ex, ey, obstacles, limit) {
    if (!obstacles.length) return null;
    var xs = {}, ys = {};
    var minX = Math.min(sx, ex), maxX = Math.max(sx, ex);
    var minY = Math.min(sy, ey), maxY = Math.max(sy, ey);
    function addX(v) { xs[Math.round(v * 10) / 10] = 1; }
    function addY(v) { ys[Math.round(v * 10) / 10] = 1; }
    addX(sx); addX(ex); addY(sy); addY(ey);
    // 两端点的中间位置也要有网格线，否则绕行只能贴着某一侧组件走
    addX((sx + ex) / 2); addY((sy + ey) / 2);
    for (var k = 0; k < obstacles.length; k++) {
      var r = obstacles[k];
      addX(r.x); addX(r.x + r.w);
      addY(r.y); addY(r.y + r.h);
      minX = Math.min(minX, r.x); maxX = Math.max(maxX, r.x + r.w);
      minY = Math.min(minY, r.y); maxY = Math.max(maxY, r.y + r.h);
    }
    // 外侧再留一圈，允许从组件外侧绕过去
    addX(minX - 40); addX(maxX + 40);
    addY(minY - 40); addY(maxY + 40);
    var X = Object.keys(xs).map(Number).sort(function (a, b) { return a - b; });
    var Y = Object.keys(ys).map(Number).sort(function (a, b) { return a - b; });
    if (X.length * Y.length > (limit || 900)) return null;

    function idx(arr, v) {
      for (var i = 0; i < arr.length; i++) if (Math.abs(arr[i] - v) < 0.2) return i;
      return -1;
    }
    function blockedAt(px, py) {
      for (var i = 0; i < obstacles.length; i++) {
        var r = obstacles[i];
        if (px > r.x + 0.5 && px < r.x + r.w - 0.5 && py > r.y + 0.5 && py < r.y + r.h - 0.5) return true;
      }
      return false;
    }
    function segBlocked(x1, y1, x2, y2) {
      for (var i = 0; i < obstacles.length; i++) {
        var r = insetRect(obstacles[i], 0.5);
        if (r.w <= 0 || r.h <= 0) continue;
        if (segmentHitsRect({ x: x1, y: y1 }, { x: x2, y: y2 }, r)) return true;
      }
      return false;
    }

    var W = X.length, H = Y.length;
    var startIdx = idx(Y, sy) * W + idx(X, sx);
    var goalIdx = idx(Y, ey) * W + idx(X, ex);
    if (startIdx < 0 || goalIdx < 0) return null;

    var g = new Array(W * H);
    var from = new Array(W * H);
    var closed = new Array(W * H);
    var open = [startIdx];
    g[startIdx] = 0;
    var turnPenalty = 40;
    var cx0 = Math.min(sx, ex), cx1 = Math.max(sx, ex);
    var cy0 = Math.min(sy, ey), cy1 = Math.max(sy, ey);
    var midX = (sx + ex) / 2, midY = (sy + ey) / 2;

    function overshoot(px, py) {
      var ox = px < cx0 ? cx0 - px : px > cx1 ? px - cx1 : 0;
      var oy = py < cy0 ? cy0 - py : py > cy1 ? py - cy1 : 0;
      return ox + oy;
    }

    // 让路径尽量靠向两端点的中间，走线看起来是对称的，而不是贴着某一侧的组件
    // （系数要小于转弯惩罚，否则会为了"靠近中间"多拐几个弯）
    function offMiddle(px, py) {
      return Math.abs(px - midX) * 0.3 + Math.abs(py - midY) * 0.3;
    }

    while (open.length) {
      var bi = 0;
      for (var i = 1; i < open.length; i++) {
        if (g[open[i]] + Math.abs(X[open[i] % W] - X[goalIdx % W]) +
          Math.abs(Y[Math.floor(open[i] / W)] - Y[Math.floor(goalIdx / W)]) <
          g[open[bi]] + Math.abs(X[open[bi] % W] - X[goalIdx % W]) +
          Math.abs(Y[Math.floor(open[bi] / W)] - Y[Math.floor(goalIdx / W)])) bi = i;
      }
      var cur = open.splice(bi, 1)[0];
      if (cur === goalIdx) break;
      if (closed[cur]) continue;
      closed[cur] = 1;
      var cxi = cur % W, cyi = Math.floor(cur / W);
      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var d = 0; d < dirs.length; d++) {
        var nx = cxi + dirs[d][0], ny = cyi + dirs[d][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var ni = ny * W + nx;
        if (closed[ni]) continue;
        var px = X[nx], py = Y[ny];
        if (blockedAt(px, py)) continue;
        if (segBlocked(X[cxi], Y[cyi], px, py)) continue;
        var step = Math.abs(px - X[cxi]) + Math.abs(py - Y[cyi]);
        var prevDir = from[cur] ? (Math.sign(X[cxi] - X[from[cur] % W]) + ',' + Math.sign(Y[cyi] - Y[Math.floor(from[cur] / W)])) : '';
        var newDir = dirs[d][0] + ',' + dirs[d][1];
        var cost = g[cur] + step + (prevDir && prevDir !== newDir ? turnPenalty : 0) +
          overshoot(px, py) * 0.6 + offMiddle(px, py);
        if (g[ni] === undefined || cost < g[ni] - 1e-6) {
          g[ni] = cost;
          from[ni] = cur;
          open.push(ni);
        }
      }
    }
    if (g[goalIdx] === undefined) return null;
    var path = [];
    var node = goalIdx;
    while (node !== undefined) {
      path.unshift({ x: X[node % W], y: Y[Math.floor(node / W)] });
      if (node === startIdx) break;
      node = from[node];
    }
    return path.length ? G.simplify(path) : null;
  }

  /** 让中间段挪到不穿过任何组件的位置（就近搜索）。 */
  function refineMiddle(build, want, win, obstacles) {
    var pts = build(want);
    if (!obstacles.length || !polylineHits(pts, obstacles)) return { pos: want, pts: pts };
    for (var k = 1; k <= 60; k++) {
      var cands = [want + k * 4, want - k * 4];
      for (var i = 0; i < cands.length; i++) {
        var v = clampBend(cands[i], win);
        if (Math.abs(v - want) < 0.01) continue;
        var p2 = build(v);
        if (!polylineHits(p2, obstacles)) return { pos: v, pts: p2 };
      }
    }
    return { pos: want, pts: pts };
  }

  /** 拐点（两个自由度）的就近搜索。 */
  function refineCorner(build, want, obstacles) {
    var pts = build(want.x, want.y);
    if (!obstacles.length || !polylineHits(pts, obstacles)) return { x: want.x, y: want.y, pts: pts };
    for (var k = 1; k <= 60; k++) {
      var cands = [
        { x: want.x + k * 4, y: want.y }, { x: want.x - k * 4, y: want.y },
        { x: want.x, y: want.y + k * 4 }, { x: want.x, y: want.y - k * 4 }
      ];
      for (var i = 0; i < cands.length; i++) {
        var p2 = build(cands[i].x, cands[i].y);
        if (!polylineHits(p2, obstacles)) return { x: cands[i].x, y: cands[i].y, pts: p2 };
      }
    }
    return { x: want.x, y: want.y, pts: pts };
  }

  /** 组件挡在正中间时的绕行方案：从两侧找一条空旷的"通道"。 */
  function detourLane(laneSegs, start, step, obstacles) {
    var probe = start;
    for (var i = 0; i < 40; i++) {
      var seg = [{ x: laneSegs[0], y: probe }, { x: laneSegs[1], y: probe }];
      if (!polylineHits(seg, obstacles)) return probe;
      probe += step;
    }
    return null;
  }

  function detourH(pa, da, db, pb, obstacles) {
    var dirs = [-1, 1];
    for (var d = 0; d < dirs.length; d++) {
      var dir = dirs[d];
      var start = dir < 0 ? Math.min(da.y, db.y) - MIN_SEG : Math.max(da.y, db.y) + MIN_SEG;
      var lane = detourLane([Math.min(da.x, db.x), Math.max(da.x, db.x)], start, dir * 20, obstacles);
      if (lane === null) continue;
      var pts = G.simplify([pa, da, { x: da.x, y: lane }, { x: db.x, y: lane }, db, pb]);
      if (!polylineHits(pts, obstacles)) return pts;
    }
    return null;
  }

  function detourV(pa, da, db, pb, obstacles) {
    var dirs = [-1, 1];
    for (var d = 0; d < dirs.length; d++) {
      var dir = dirs[d];
      var start = dir < 0 ? Math.min(da.x, db.x) - MIN_SEG : Math.max(da.x, db.x) + MIN_SEG;
      var probe = start, lane = null;
      for (var i = 0; i < 40 && lane === null; i++) {
        var seg = [{ x: probe, y: Math.min(da.y, db.y) }, { x: probe, y: Math.max(da.y, db.y) }];
        if (!polylineHits(seg, obstacles)) lane = probe; else probe += dir * 20;
      }
      if (lane === null) continue;
      var pts = G.simplify([pa, da, { x: lane, y: da.y }, { x: lane, y: db.y }, db, pb]);
      if (!polylineHits(pts, obstacles)) return pts;
    }
    return null;
  }

  /* ---------------- 三种连线方式 ---------------- */

  function endPoint(node, other, port, off) {
    var side = resSide(node, other, port);
    if (isFixed(port) || off) return offPort(node, side, off);
    var c = G.rectCenter(other);
    return G.shapeBoundaryPoint(node, c.x, c.y);
  }

  function straightGeom(a, b, edge, opts) {
    var off = opts.offset || 0;
    var ac = G.rectCenter(a), bc = G.rectCenter(b);
    var sideA = resSide(a, b, edge.from.port);
    var sideB = resSide(b, a, edge.to.port);
    var p0 = endPoint(a, b, edge.from.port, off);
    var p1 = endPoint(b, a, edge.to.port, off);
    var pts = G.simplify([p0, p1]);
    var mid = G.polylineMidpoint(pts);
    return {

      }

    }

      var out = [];
      for (var i = 0; i < state.selection.edges.length; i++) {
        var e = edgeById(state.selection.edges[i]);

      }

      }
      setAttrs(gridRect, {
        fill: settings.grid ? 'url(#fdGrid)' : 'transparent',
        style: settings.grid ? null : 'fill: transparent'
      });
      // 网格密度过小时不再显示，避免糊成一片
      var tooDense = size * view.zoom < 6;
      setAttrs(gridRect, { opacity: settings.grid && !tooDense ? 1 : 0 });
    }

    /* ---------- 文本排版缓存 ---------- */

    var wrapCache = new Map();
  var themeTextColor = null;
  var themeCanvasBg = null;
  var MIN_LABEL_GAP = 12;
  var currentNodes = [];

  /** 标签不能压住组件：落在组件附近时推到外面，保持一点距离。 */
  function clampLabelPos(pos, nodes) {
    var p = { x: pos.x, y: pos.y };
    for (var i = 0; i < nodes.length; i++) {
      var r = G.expandRect(nodes[i], MIN_LABEL_GAP);
      if (!G.pointInRect(p.x, p.y, r)) continue;
      var dl = p.x - r.x, dr = r.x + r.w - p.x;
      var dt = p.y - r.y, db = r.y + r.h - p.y;
      var m = Math.min(dl, dr, dt, db);
      if (m === dl) p.x = r.x;
      else if (m === dr) p.x = r.x + r.w;
      else if (m === dt) p.y = r.y;
      else p.y = r.y + r.h;
    }
    return p;
  }

  function cssVar(name, fallback) {
    var v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name); } catch (err) { v = ''; }
    return (v || '').trim() || fallback;
  }

  function uiTextColor() {
    if (!themeTextColor) themeTextColor = cssVar('--text', '#1f2733');
    return themeTextColor;
  }

  /** 箭头标签的底色：必须写成属性，否则导出的 SVG 里会变成默认黑色。 */
  function uiCanvasBg() {
    if (!themeCanvasBg) themeCanvasBg = cssVar('--canvas-bg', '#ffffff');
    return themeCanvasBg;
  }

    function layout(node) {
      var st = node.style;
      var padX = (G.getShape(node.shape).textPad || 10) + (node.shape === 'text' ? 0 : 0);
      var maxW = Math.max(12, node.w - padX * 2);
      var key = node.text + '\u0000' + st.fontSize + '\u0000' + (st.bold ? 1 : 0) + '\u0000' + Math.round(maxW);
      var lines = wrapCache.get(key);
      if (!lines) {
        lines = G.wrapText(node.text, maxW, st.fontSize, st.bold);
        if (wrapCache.size > 800) wrapCache.clear();
        wrapCache.set(key, lines);
      }
      var lh = st.fontSize * 1.35;
      return { lines: lines, lh: lh, padX: padX, maxW: maxW };
    }

    /* ---------- 组件渲染 ---------- */

    var nodeEls = new Map();
    var edgeEls = new Map();
    var uiSig = null;
    var hotSig = null;

    function renderNode(rec, node) {
      var st = node.style;
      var g = rec.g;
      setAttrs(g, { transform: 'translate(' + G.f(node.x) + ' ' + G.f(node.y) + ')', 'data-id': node.id });

      var shape = G.getShape(node.shape);
      var radius = shape.radiusEditable ? G.clamp(st.radius == null ? shape.defaultRadius : st.radius, 0, Math.min(node.w, node.h) / 2) : 0;
      var d = shape.noShape ? '' : shape.draw(0, 0, node.w, node.h, radius, shape);

      if (!rec.path) {
        rec.path = mk('path', { class: 'node-shape' });
        rec.hit = mk('path', { class: 'node-hit', fill: 'transparent', stroke: 'transparent', 'stroke-width': 12 });
        rec.decor = mk('path', { class: 'node-decor', fill: 'none' });
        rec.text = mk('text', { class: 'node-text' });
        rec.hit.setAttribute('data-node', node.id);
        g.appendChild(rec.path);
        g.appendChild(rec.decor);
        g.appendChild(rec.hit);
        g.appendChild(rec.text);
      }

      var decor = shape.noShape ? [] : G.shapeDecor({ x: 0, y: 0, w: node.w, h: node.h, shape: node.shape, radius: radius });
      setAttrs(rec.decor, {
        d: decor.length ? decor.join(' ') : null,
        stroke: decor.length ? (st.stroke === 'none' ? 'none' : st.stroke) : null,
        'stroke-width': st.strokeWidth, 'stroke-dasharray': st.dash || null, opacity: 0.75
      });
      setAttrs(rec.path, {
        d: d || null,
        fill: st.fill || 'none',
        stroke: st.strokeWidth > 0 && st.stroke !== 'none' ? st.stroke : 'none',
        'stroke-width': st.strokeWidth,
        'stroke-dasharray': st.dash || null,
        'stroke-linejoin': 'round',
        filter: st.shadow && !shape.noShape ? 'url(#fdShadow)' : null
      });
      setAttrs(rec.hit, { d: d || ('M0 0H' + G.f(node.w) + 'V' + G.f(node.h) + 'H0Z'), 'data-node': node.id });

      var lay = layout(node);
      var fontSize = st.fontSize;
      var anchor = st.align === 'left' ? 'start' : st.align === 'right' ? 'end' : 'middle';
      var tx = st.align === 'left' ? lay.padX : st.align === 'right' ? node.w - lay.padX : node.w / 2;
      var startY = node.h / 2 - (lay.lines.length - 1) * lay.lh / 2;
      var textSig = lay.lines.join('\u0001') + '|' + fontSize + '|' + st.fontColor + '|' + st.bold + '|' + st.italic + '|' + anchor + '|' + G.f(tx) + '|' + G.f(startY) + '|' + lay.lh;

      if (rec.textSig !== textSig) {
        rec.textSig = textSig;
        setAttrs(rec.text, {
          'font-size': fontSize,
          'font-weight': st.bold ? 700 : 400,
          'font-style': st.italic ? 'italic' : null,
          'font-family': FONT,
          fill: st.fontColor,
          'text-anchor': anchor,
          'dominant-baseline': 'central'
        });
        clear(rec.text);
        for (var i = 0; i < lay.lines.length; i++) {
          var tspan = mk('tspan', { x: G.f(tx), y: G.f(startY + i * lay.lh) });
          tspan.textContent = lay.lines[i];
          rec.text.appendChild(tspan);
        }
      }
      rec.node = node;
    }

    function renderEdge(rec, edge, geo, selected) {
      var st = edge.style;
      var g = rec.g;
      if (!rec.visible) {
        rec.hit = mk('path', { class: 'edge-hit' });
        rec.visible = mk('path', { class: 'edge-visible' });
        rec.labelBg = mk('rect', { class: 'edge-label-bg', rx: 4, fill: uiCanvasBg() });
        rec.label = mk('text', { class: 'edge-label', 'dominant-baseline': 'central' });
        g.appendChild(rec.hit);
        g.appendChild(rec.visible);
        g.appendChild(rec.labelBg);
        g.appendChild(rec.label);
      }
      setAttrs(g, { 'data-id': edge.id });
      var markerEnd = st.arrowEnd ? 'url(#' + ensureMarker(st.color) + ')' : null;
      var markerStart = st.arrowStart ? 'url(#' + ensureMarker(st.color) + ')' : null;
      setAttrs(rec.hit, { d: geo.d, 'data-edge': edge.id });
      setAttrs(rec.visible, {
        d: geo.d, fill: 'none', stroke: st.color, 'stroke-width': st.strokeWidth,
        'stroke-dasharray': st.dash || null,
        'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        'marker-end': markerEnd, 'marker-start': markerStart,
        opacity: selected ? 1 : 0.96
      });

      if (edge.label) {
        var w = G.textWidth(edge.label, 12) + 10;
        var lp = edge.labelPos ? clampLabelPos(edge.labelPos, currentNodes) : geo.label;
        setAttrs(rec.labelBg, {
          x: G.f(lp.x - w / 2), y: G.f(lp.y - 9),
          width: G.f(w), height: 18, fill: uiCanvasBg()
        });
        setAttrs(rec.label, {
          x: G.f(lp.x), y: G.f(lp.y),
          'text-anchor': 'middle', 'font-family': FONT, fill: uiTextColor()
        });
        if (rec.label.textContent !== edge.label) rec.label.textContent = edge.label;
        rec.label.setAttribute('data-label', edge.id);
        rec.label.setAttribute('data-edge', edge.id);
        rec.labelBg.setAttribute('data-label', edge.id);
        rec.labelBg.setAttribute('data-edge', edge.id);
      } else {
        setAttrs(rec.labelBg, { width: 0, height: 0 });
        if (rec.label.textContent) rec.label.textContent = '';
        rec.label.removeAttribute('data-label');
        rec.labelBg.removeAttribute('data-label');
      }
    }

    /* ---------- 选中框 / 手柄 / 连接点 ---------- */

    function w2s(p, view) { return { x: p.x * view.zoom + view.x, y: p.y * view.zoom + view.y }; }

    function rectToScreen(rect, view) {
      var p = w2s(rect, view);
      return { x: p.x, y: p.y, w: rect.w * view.zoom, h: rect.h * view.zoom };
    }

    function renderChrome(state, sig, ctx) {
      if (uiSig !== sig) {
        uiSig = sig;
        clear(layerUi);
        var view = state.view;
        var nodes = state.nodes;
        var multi = state.selection.nodes.length > 1;

        // 悬停高亮
        if (ctx.hoverId && !state.selection.nodes.length) {
          var hn = findNode(nodes, ctx.hoverId);
          if (hn) {
            var r = rectToScreen(hn, view);
            layerUi.appendChild(mk('rect', {
              class: 'hover-outline', x: r.x - 1, y: r.y - 1, width: r.w + 2, height: r.h + 2, rx: 3
            }));
          }
        }

        var sel = state.selection.nodes;
        for (var i = 0; i < sel.length; i++) {
          var node = findNode(nodes, sel[i]);
          if (!node) continue;
          var rs = rectToScreen(node, view);
          layerUi.appendChild(mk('rect', {
            class: 'sel-outline', x: rs.x - 1, y: rs.y - 1, width: rs.w + 2, height: rs.h + 2, rx: 3
          }));
        }

        // 选中的箭头显示可拖动的端点
        var edgeSel = state.selection.edges;
        for (var ei = 0; ei < edgeSel.length; ei++) {
          var geo = ctx.edgeGeos && ctx.edgeGeos[edgeSel[ei]];
          if (!geo) continue;
          var ends = [['from', geo.start], ['to', geo.end]];
          for (var q = 0; q < ends.length; q++) {
            var ep = w2s(ends[q][1], view);
            layerUi.appendChild(mk('circle', {
              class: 'edge-anchor', cx: G.f(ep.x), cy: G.f(ep.y), r: 5.5,
              'data-anchor': ends[q][0], 'data-edge': edgeSel[ei]
            }));
          }
        }

        // 单选时显示缩放手柄与连接点
        if (sel.length === 1 && !ctx.editing) {
          var n = findNode(nodes, sel[0]);
          if (n && !n.locked) {
            var r1 = rectToScreen(n, view);
            var hs = HANDLE_SIZE;
            var defs = [
              ['nw', r1.x, r1.y], ['n', r1.x + r1.w / 2, r1.y], ['ne', r1.x + r1.w, r1.y],
              ['e', r1.x + r1.w, r1.y + r1.h / 2], ['se', r1.x + r1.w, r1.y + r1.h],
              ['s', r1.x + r1.w / 2, r1.y + r1.h], ['sw', r1.x, r1.y + r1.h], ['w', r1.x, r1.y + r1.h / 2]
            ];
            for (var k = 0; k < defs.length; k++) {
              var h = mk('rect', {
                class: 'handle', x: defs[k][1] - hs / 2, y: defs[k][2] - hs / 2,
                width: hs, height: hs, rx: 2,
                'data-handle': defs[k][0], 'data-node': n.id,
                style: 'cursor: ' + (HANDLE_CURSOR[defs[k][0]] || 'default') + '-resize'
              });
              layerUi.appendChild(h);
            }
          }
          if (n) {
            var ports = G.nodePorts(n);
            for (var p = 0; p < ports.length; p++) {
              var sp = w2s(ports[p], view);
              layerUi.appendChild(mk('circle', {
                class: 'port', cx: G.f(sp.x), cy: G.f(sp.y), r: PORT_R,
                'data-port': ports[p].side, 'data-node': n.id
              }));
            }
          }
        }

        // 多选时显示整体外框
        if (multi) {
          var boxes = selectedRects(state);
          if (boxes) {
            var rb = rectToScreen(boxes, view);
            layerUi.appendChild(mk('rect', {
              class: 'sel-outline', x: rb.x - 6, y: rb.y - 6, width: rb.w + 12, height: rb.h + 12, rx: 4, opacity: 0.55
            }));
          }
        }

        // 折线拐点手柄放在最后，保证压在其他操纵点之上、不会被挡住
        for (var ej = 0; ej < state.selection.edges.length; ej++) {
          var bgeo = ctx.edgeGeos && ctx.edgeGeos[state.selection.edges[ej]];
          if (!bgeo || !bgeo.bend) continue;
          var cornerH = bgeo.bend.kind === 'corner';
          var hx = cornerH ? bgeo.bend.x
            : (bgeo.bend.axis === 'x' ? bgeo.bend.pos : (bgeo.bend.from + bgeo.bend.to) / 2);
          var hy = cornerH ? bgeo.bend.y
            : (bgeo.bend.axis === 'x' ? (bgeo.bend.from + bgeo.bend.to) / 2 : bgeo.bend.pos);
          var hpt = w2s({ x: hx, y: hy }, view);
          var handle = mk('rect', {
            class: 'bend-handle', x: G.f(hpt.x - 6.5), y: G.f(hpt.y - 6.5),
            width: 13, height: 13, rx: 3,
            'data-bend': cornerH ? 'corner' : bgeo.bend.axis,
            'data-edge': state.selection.edges[ej],
            style: 'cursor: ' + (cornerH ? 'move' : (bgeo.bend.axis === 'x' ? 'ew' : 'ns') + '-resize')
          });
          var hint = mk('title');
          hint.textContent = cornerH ? '拖动调整折线拐点' : '拖动这根直线改变折线走位';
          handle.appendChild(hint);
          layerUi.appendChild(handle);
        }
      }
    }

    function findNode(nodes, id) {
      for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i];
      return null;
    }

    function selectedRects(state) {
      var rects = [];
      for (var i = 0; i < state.selection.nodes.length; i++) {
        var n = findNode(state.nodes, state.selection.nodes[i]);
        if (n) rects.push(n);
      }
      return rects.length ? G.unionRects(rects) : null;
    }

    /* ---------- 临时覆盖层 ---------- */

    var previewSig = null;

    /** 拖放预览：用真实形状的虚线轮廓显示松手后会落在哪里。 */
    function setPreview(nodes) {
      var list = nodes || [];
      var sig = JSON.stringify(list.map(function (n) {
        return [n.shape, G.f(n.x), G.f(n.y), G.f(n.w), G.f(n.h), G.f(n.radius || 0)];
      }));
      if (sig === previewSig) return;
      previewSig = sig;
      clear(layerGhost);
      list.forEach(function (n) {
        var shape = G.getShape(n.shape);
        var d = shape.noShape ? '' : shape.draw(n.x, n.y, n.w, n.h, n.radius || 0, shape);
        if (!d) return;
        layerGhost.appendChild(mk('path', { class: 'ghost-shape', d: d }));
      });
    }

    function setOverlay(o) {
      o = o || {};
      var sig = JSON.stringify([
        o.guides || [], o.marquee || null, o.ghost || null, o.hotPort || null, o.hotNode || null,
        o.link ? [G.round2(o.link.from.x), G.round2(o.link.from.y), G.round2(o.link.to.x), G.round2(o.link.to.y)] : null,
        o.view ? [o.view.x, o.view.y, o.view.zoom] : null
      ]);
      if (sig === hotSig) return;
      hotSig = sig;
      var view = o.view;
      clear(layerGuides);
      clear(layerMarquee);
      clear(layerHot);

      if (o.guides) {
        for (var i = 0; i < o.guides.length; i++) {
          var gd = o.guides[i];
          var a, b, labelPos;
          if (gd.axis === 'v') {
            a = w2s({ x: gd.pos, y: gd.from - 12 }, view);
            b = w2s({ x: gd.pos, y: gd.to + 12 }, view);
          } else {
            a = w2s({ x: gd.from - 12, y: gd.pos }, view);
            b = w2s({ x: gd.to + 12, y: gd.pos }, view);
          }
          layerGuides.appendChild(mk('line', { class: 'guide-line', x1: G.f(a.x), y1: G.f(a.y), x2: G.f(b.x), y2: G.f(b.y) }));
          if (o.showGuideLabel) {
            labelPos = gd.axis === 'v' ? { x: a.x + 4, y: Math.min(a.y, b.y) + 11 } : { x: Math.min(a.x, b.x) + 4, y: a.y - 4 };
            var ltext = mk('text', { class: 'guide-label', x: G.f(labelPos.x), y: G.f(labelPos.y) });
            ltext.textContent = gd.axis === 'v' ? 'x=' + G.f(gd.pos) : 'y=' + G.f(gd.pos);
            layerGuides.appendChild(ltext);
          }
        }
      }

      if (o.marquee) {
        layerMarquee.appendChild(mk('rect', {
          class: 'marquee', x: G.f(o.marquee.x), y: G.f(o.marquee.y),
          width: G.f(o.marquee.w), height: G.f(o.marquee.h)
        }));
      }

      if (o.ghost) {
        if (o.ghost.node) {
          var gr = rectToScreen(o.ghost.node, view);
          layerHot.appendChild(mk('rect', {
            class: 'ghost-node', x: gr.x, y: gr.y, width: gr.w, height: gr.h, rx: 4
          }));
        }
        if (o.ghost.path) {
          layerHot.appendChild(mk('path', { class: 'ghost-edge', d: o.ghost.path }));
        }
      }

      if (o.hotNode) {
        var hr = rectToScreen(o.hotNode, view);
        layerHot.appendChild(mk('rect', {
          class: 'ghost-node', x: hr.x - 3, y: hr.y - 3, width: hr.w + 6, height: hr.h + 6, rx: 5
        }));
      }
      if (o.hotPort) {
        var hp = w2s(o.hotPort, view);
        layerHot.appendChild(mk('circle', {
          class: 'anchor-halo', cx: G.f(hp.x), cy: G.f(hp.y), r: 11
        }));
        layerHot.appendChild(mk('circle', { class: 'anchor-dot', cx: G.f(hp.x), cy: G.f(hp.y), r: 4.5 }));
      }
      if (o.link) {
        var la = w2s(o.link.from, view), lb = w2s(o.link.to, view);
        layerHot.appendChild(mk('line', {
          class: 'label-link', x1: G.f(la.x), y1: G.f(la.y), x2: G.f(lb.x), y2: G.f(lb.y)
        }));
      }
    }

    /* ---------- 主渲染 ---------- */

    function render(state, ctx) {
      ctx = ctx || {};
      applyView(state.view);
      applyGrid(state.settings, state.view);

      var nodes = state.nodes;
      currentNodes = nodes;
      var map = {};
      var alive = {};
      var i, node;

      for (i = 0; i < nodes.length; i++) {
        node = nodes[i];
        map[node.id] = node;
        alive[node.id] = true;
        var rec = nodeEls.get(node.id);
        if (!rec) {
          rec = { g: mk('g', { class: 'node' }) };
          layerNodes.appendChild(rec.g);
          nodeEls.set(node.id, rec);
        }
        // 保证 DOM 顺序与数据顺序一致，否则「置顶/置底」看不出效果
        if (layerNodes.children[i] !== rec.g) layerNodes.insertBefore(rec.g, layerNodes.children[i] || null);
        renderNode(rec, node);
      }
      nodeEls.forEach(function (rec, id) {
        if (!alive[id]) { layerNodes.removeChild(rec.g); nodeEls.delete(id); }
      });

      var aliveEdges = {};
      var edgeGeos = {};
      var edgeSlot = 0;
      var offsets = R.edgeLayout(state.edges, map);
      for (i = 0; i < state.edges.length; i++) {
        var edge = state.edges[i];
        var lay = offsets[edge.id] || { offset: 0, slot: 0 };
        var geo = R.edgeGeometry(edge, map, {
          offset: lay.offset,
          slot: lay.slot,
          stub: R.requiredStub(edge, state.settings.tailMin)
        });
        if (!geo) continue;
        edgeGeos[edge.id] = geo;
        aliveEdges[edge.id] = true;
        var erec = edgeEls.get(edge.id);
        if (!erec) {
          erec = { g: mk('g', { class: 'edge' }) };
          layerEdges.appendChild(erec.g);
          edgeEls.set(edge.id, erec);
        }
        if (layerEdges.children[edgeSlot] !== erec.g) {
          layerEdges.insertBefore(erec.g, layerEdges.children[edgeSlot] || null);
        }
        edgeSlot++;
        renderEdge(erec, edge, geo, state.selection.edges.indexOf(edge.id) >= 0);
      }
      edgeEls.forEach(function (rec, id) {
        if (!aliveEdges[id]) { layerEdges.removeChild(rec.g); edgeEls.delete(id); }
      });

      var uiSignature = JSON.stringify([
        state.selection.nodes, state.view.x, state.view.y, state.view.zoom,
        nodes.filter(function (n) { return state.selection.nodes.indexOf(n.id) >= 0; })
          .map(function (n) { return [n.id, n.x, n.y, n.w, n.h, n.locked ? 1 : 0]; }),
        state.selection.edges.map(function (id) {
          var g = edgeGeos[id];
          if (!g) return [id];
          return [id, G.round2(g.start.x), G.round2(g.start.y), G.round2(g.end.x), G.round2(g.end.y),
          g.bend ? JSON.stringify(g.bend) : null];
        }),
        ctx.hoverId || null, ctx.editing ? 1 : 0
      ]);
      ctx.edgeGeos = edgeGeos;
      renderChrome(state, uiSignature, ctx);
    }

    return {
      render: render, setOverlay: setOverlay, setPreview: setPreview, applyView: applyView,
      rectToScreen: rectToScreen, w2s: w2s,
      invalidateChrome: function () { uiSig = null; },
      invalidateOverlay: function () { hotSig = null; },
      invalidateTheme: function () { themeTextColor = null; themeCanvasBg = null; }
    };
  }

  window.FD.createView = createView;
})();
</script>
<script>
/* templates.js —— 示例模板。返回可直接交给 store.load 的数据结构。 */
(function () {
  'use strict';

  var G = window.FD.geom;

  function build(spec) {
    var idmap = {};
    var nodes = spec.nodes.map(function (raw) {
      var shape = G.getShape(raw.shape);
      var id = G.uid('n');
      idmap[raw.id] = id;
      return {
        id: id,
        shape: raw.shape,
        x: raw.x, y: raw.y,
        w: raw.w || shape.defaultW,
        h: raw.h || shape.defaultH,
        text: raw.text,
        style: Object.assign({
          fill: raw.fill || '#ffffff',
          stroke: '#3c4657', strokeWidth: 1.6, dash: '',
          radius: shape.radiusEditable ? (raw.radius == null ? shape.defaultRadius : raw.radius) : null,
          fontColor: '#1f2733', fontSize: raw.fontSize || 14,
          bold: !!raw.bold, italic: false, align: 'center', shadow: !!raw.shadow
        })
      };
    });
    var edges = spec.edges.map(function (raw) {
      return {
        id: G.uid('e'),
        from: { node: idmap[raw.from], port: raw.fromPort || 'auto' },
        to: { node: idmap[raw.to], port: raw.toPort || 'auto' },
        mode: raw.mode || 'orthogonal',
        label: raw.label || '',
        style: {
          color: raw.color || '#5d6779', strokeWidth: 1.8, dash: raw.dash || '',
          arrowEnd: true, arrowStart: !!raw.arrowStart, biMode: 'none'
        }
      };
    });
    return { nodes: nodes, edges: edges };
  }

  var approvalSpec = {
    nodes: [
      { id: 's', shape: 'terminator', x: 200, y: 40, w: 140, h: 60, text: '开始' },
      { id: 'a', shape: 'process', x: 190, y: 140, w: 160, h: 60, text: '提交报销单' },
      { id: 'b', shape: 'process', x: 190, y: 240, w: 160, h: 60, text: '主管审批' },
      { id: 'c', shape: 'decision', x: 190, y: 340, w: 160, h: 80, text: '金额 > 5000？', fontSize: 13 },
      { id: 'd', shape: 'process', x: 420, y: 340, w: 160, h: 80, text: '财务复核', fill: '#eef4ff' },
      { id: 'e', shape: 'process', x: 20, y: 340, w: 140, h: 80, text: '自动通过', fill: '#eefbf3' },
      { id: 'f', shape: 'database', x: 430, y: 480, w: 140, h: 80, text: '记账归档' },
      { id: 'g', shape: 'terminator', x: 200, y: 600, w: 140, h: 60, text: '结束' }
    ],
    edges: [
      { from: 's', to: 'a' },
      { from: 'a', to: 'b' },
      { from: 'b', to: 'c' },
      { from: 'c', to: 'd', label: '是', fromPort: 'r', toPort: 'l' },
      { from: 'c', to: 'e', label: '否', fromPort: 'l', toPort: 'r' },
      { from: 'd', to: 'f' },
      { from: 'e', to: 'g' },
      { from: 'f', to: 'g' }
    ]
  };

  var loginSpec = {
    nodes: [
      { id: 's', shape: 'terminator', x: 200, y: 40, w: 140, h: 60, text: '开始' },
      { id: 'a', shape: 'process', x: 190, y: 140, w: 160, h: 60, text: '打开登录页' },
      { id: 'b', shape: 'data', x: 190, y: 240, w: 160, h: 60, text: '输入账号与密码' },
      { id: 'c', shape: 'decision', x: 190, y: 340, w: 160, h: 80, text: '校验通过？' },
      { id: 'd', shape: 'process', x: 420, y: 340, w: 160, h: 80, text: '进入首页', fill: '#eefbf3' },
      { id: 'e', shape: 'process', x: 20, y: 340, w: 140, h: 80, text: '提示错误信息', fill: '#fff1f1' },
      { id: 'f', shape: 'terminator', x: 430, y: 480, w: 140, h: 60, text: '结束' }
    ],
    edges: [
      { from: 's', to: 'a' },
      { from: 'a', to: 'b' },
      { from: 'b', to: 'c' },
      { from: 'c', to: 'd', label: '是', fromPort: 'r', toPort: 'l' },
      { from: 'c', to: 'e', label: '否', fromPort: 'l', toPort: 'r' },
      { from: 'e', to: 'b', label: '重试' },
      { from: 'd', to: 'f' }
    ]
  };

  window.FD.templates = {
    list: [
      { key: 'approval', name: '审批流程图' },
      { key: 'login', name: '登录流程图' }
    ],
    spec: function (key) {
      if (key === 'approval') return approvalSpec;
      if (key === 'login') return loginSpec;
      return null;
    },
    build: function (key) {
      var spec = this.spec(key);
      return spec ? build(spec) : null;
    }
  };
})();
</script>
<script>
/* app.js —— 交互、面板、快捷键、导入导出。 */
(function () {
  'use strict';

  var G = window.FD.geom, R = window.FD.router, Snap = window.FD.snap;
  var SVGNS = 'http://www.w3.org/2000/svg';
  var FONT = 'system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
  var MIN_SIZE = 16;
  var STORAGE_DOC = 'fd.doc.v1';
  var STORAGE_SETTINGS = 'fd.settings.v1';
  var STORAGE_SHAPES = 'fd.customShapes.v1';
  var STORAGE_TEMPLATES = 'fd.templates.v1';
  var STORAGE_TABS = 'fd.tabs.v1';

  var store = window.FD.createStore();
  var state = store.state;
  var settings = state.settings;      // 全局设置，所有画板共用
  var tabs = [];                      // 多画板：[{id, name, store}]
  var activeTabId = null;
  var draggingTemplate = null;
  var draggingShape = null;

  function el(id) { return document.getElementById(id); }
  function closest(node, sel) { return node && node.closest ? node.closest(sel) : null; }

  /* ---------------- 文本测量 ---------------- */

  (function () {
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    G.setMeasurer(function (str, size, bold) {
      ctx.font = (bold ? '700 ' : '400 ') + size + 'px ' + FONT;
      return ctx.measureText(str).width;
    });
  })();

  /* ---------------- 基础引用 ---------------- */

  var board = el('board');
  var wrap = el('canvasWrap');
  var editor = el('editor');
  var view = window.FD.createView(board);

  var tool = 'select';
  var drag = null;
  var editing = null;
  var hoverId = null;
  var spaceDown = false;
  var clipboard = null;
  var syncing = false;
  var nudgeGroup = null;
  var saveTimer = null;
  var msgTimer = null;

  /* ---------------- 坐标换算 ---------------- */

  function pointerScreen(e) {
    var r = board.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function pointerWorld(e) {
    var s = pointerScreen(e);
    return { x: (s.x - state.view.x) / state.view.zoom, y: (s.y - state.view.y) / state.view.zoom };
  }
  function screenRectToWorld(r) {
    return {
      x: (r.x - state.view.x) / state.view.zoom,
      y: (r.y - state.view.y) / state.view.zoom,
      w: r.w / state.view.zoom,
      h: r.h / state.view.zoom
    };
  }

  /* ---------------- 消息与光标 ---------------- */

  function msg(text, kind) {
    var node = el('stMessage');
    node.textContent = text;
    node.className = 'msg' + (kind ? ' ' + kind : '');
    if (msgTimer) clearTimeout(msgTimer);
    if (kind !== 'sticky') {
      msgTimer = setTimeout(function () { node.textContent = '就绪'; node.className = 'msg'; }, 3200);
    }
  }

  function pill(text, dur) {
    var node = el('pillHint');
    node.dataset.sticky = '';
    node.textContent = text;
    node.classList.add('show');
    if (pill._t) clearTimeout(pill._t);
    pill._t = setTimeout(function () { node.classList.remove('show'); }, dur || 2200);
  }

  /** 空画布时常驻显示引导提示 */
  function updateEmptyHint() {
    var node = el('pillHint');
    if (state.nodes.length === 0 && !drag && !editing) {
      if (pill._t) { clearTimeout(pill._t); pill._t = null; }
      node.dataset.sticky = '1';
      node.textContent = '从左侧拖入组件，或双击画布快速新建';
      node.classList.add('show');
    } else if (node.dataset.sticky === '1') {
      node.dataset.sticky = '';
      node.classList.remove('show');
    }
  }

  function setCursor(name) { wrap.dataset.cursor = name || (tool === 'pan' ? 'grab' : tool === 'connect' ? 'crosshair' : 'default'); }

  /* ---------------- 渲染 ---------------- */

  function render() {
    view.render(state, { hoverId: hoverId, editing: !!editing });
    updateEmptyHint();
    syncProps();
    updateStatus();
    scheduleAutosave();
  }

  function updateStatus() {
    var n = state.selection.nodes.length, e = state.selection.edges.length;
    el('stSelection').textContent = (n + e) === 0 ? '未选中'
      : '选中 ' + (n ? n + ' 个组件' : '') + (n && e ? '、' : '') + (e ? e + ' 条箭头' : '');
    el('stZoom').textContent = Math.round(state.view.zoom * 100) + '%';
    el('btn-zoom-reset').textContent = Math.round(state.view.zoom * 100) + '%';
    el('btn-undo').disabled = !store.canUndo();
    el('btn-redo').disabled = !store.canRedo();
  }

  function updatePointerReadout(p) {
    var node = el('stPointer');
    if (p) node.textContent = 'x: ' + Math.round(p.x) + ', y: ' + Math.round(p.y);
  }

  /* ---------------- 设置 ---------------- */

  var CHIP_MAP = [
    ['grid', 'tg-grid'], ['snapGrid', 'tg-snap-grid'], ['snapGuides', 'tg-guides'], ['snapPorts', 'tg-ports'],
    ['grid', 'cs-grid'], ['snapGrid', 'cs-snapGrid'], ['snapGuides', 'cs-guides'], ['snapPorts', 'cs-ports']
  ];

  function syncSettingsUI() {
    var s = state.settings;
    CHIP_MAP.forEach(function (pair) {
      var node = el(pair[1]);
      if (!node) return;
      var on = !!s[pair[0]];
      node.classList.toggle('on', on);
      node.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    el('sel-grid-size').value = String(s.gridSize);
    el('cs-gridSize').value = s.gridSize;
    el('cs-tailMin').value = s.tailMin;
    el('sel-grid-style').value = s.gridStyle;
    el('cs-gridStyle').value = s.gridStyle;
    el('cs-threshold').value = s.threshold;
    el('cs-edgeMode').value = s.edgeMode;
    var segs = el('edgeModeGroup').querySelectorAll('.seg');
    for (var i = 0; i < segs.length; i++) segs[i].classList.toggle('on', segs[i].dataset.edgeMode === s.edgeMode);
  }

  function setSetting(key, value) {
    state.settings[key] = value;
    syncSettingsUI();
    saveSettings();
    render();
  }

  function saveSettings() {
    try { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(state.settings)); } catch (err) { /* 忽略 */ }
  }

  function scheduleAutosave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORAGE_TABS, JSON.stringify({
          active: activeTabId,
          tabs: tabs.map(function (tab) {
            return { id: tab.id, name: tab.name, data: tab.store.serialize() };
          })
        }));
      } catch (err) { /* 忽略 */ }
    }, 700);
  }

  /* ---------------- 多画板（标签页） ---------------- */

  function tabById(id) {
    for (var i = 0; i < tabs.length; i++) if (tabs[i].id === id) return tabs[i];
    return null;
  }

  function createTab(name, data, id) {
    var s = window.FD.createStore();
    s.state.settings = settings;
    if (data) s.load(data, true);
    var tab = { id: id || G.uid('tab'), name: name || ('画板 ' + (tabs.length + 1)), store: s };
    tabs.push(tab);
    return tab;
  }

  function activateTab(id) {
    var tab = tabById(id);
    if (!tab) return;
    if (editing) commitEdit(true);
    activeTabId = id;
    store = tab.store;
    state = store.state;
    state.settings = settings;
    applyTheme(settings.theme || 'light');
    syncSettingsUI();
    applyPanelState('left');
    applyPanelState('right');
    view.invalidateChrome();
    view.invalidateOverlay();
    renderTabs();
    render();
    scheduleAutosave();
  }

  function closeTab(id) {
    if (tabs.length <= 1) { msg('至少要保留一个画板', 'warn'); return; }
    var idx = -1;
    tabs.forEach(function (tab, i) { if (tab.id === id) idx = i; });
    if (idx < 0) return;
    var wasActive = (id === activeTabId);
    tabs.splice(idx, 1);
    if (wasActive) activateTab(tabs[Math.min(idx, tabs.length - 1)].id);
    else { renderTabs(); scheduleAutosave(); }
    msg('已关闭画板');
  }

  function renameTab(id) {
    var tab = tabById(id);
    if (!tab) return;
    var name = null;
    try { name = window.prompt('画板名称：', tab.name); } catch (err) { name = null; }
    if (name === null) return;
    tab.name = String(name).trim().slice(0, 16) || tab.name;
    renderTabs();
    scheduleAutosave();
  }

  function renderTabs() {
    var list = el('tabList');
    if (!list) return;
    list.innerHTML = '';
    tabs.forEach(function (tab) {
      var btn = document.createElement('button');
      btn.className = 'tab' + (tab.id === activeTabId ? ' on' : '');
      btn.title = tab.name + '（双击重命名）';
      var nm = document.createElement('span');
      nm.className = 'tab-name';
      nm.textContent = tab.name;
      btn.appendChild(nm);
      if (tabs.length > 1) {
        var x = document.createElement('span');
        x.className = 'tab-close';
        x.textContent = '×';
        x.title = '关闭这个画板';
        x.addEventListener('click', function (ev) {
          ev.stopPropagation();
          closeTab(tab.id);
        });
        btn.appendChild(x);
      }
      btn.addEventListener('click', function () {
        if (tab.id !== activeTabId) activateTab(tab.id);
      });
      btn.addEventListener('dblclick', function () { renameTab(tab.id); });
      list.appendChild(btn);
    });
  }

  /* ---------------- 组件库 ---------------- */

  function shapeIcon(key, w, h) {
    var shape = G.getShape(key);
    var boxW = 34, boxH = 24;
    var rect = { x: 2, y: 2, w: boxW, h: boxH };
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + (boxW + 4) + ' ' + (boxH + 4));
    svg.setAttribute('width', 38);
    svg.setAttribute('height', 28);
    var path = document.createElementNS(SVGNS, 'path');
    var d = shape.draw(rect.x, rect.y, rect.w, rect.h, shape.radiusEditable ? Math.min(4, shape.defaultRadius) : 0, shape);
    if (d) {
      path.setAttribute('d', d);
      path.setAttribute('fill', 'currentColor');
      path.setAttribute('fill-opacity', '0.14');
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('stroke-width', '1.4');
      svg.appendChild(path);
    }
    if (shape.noShape) {
      var t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('x', boxW / 2 + 2);
      t.setAttribute('y', boxH / 2 + 6);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '12');
      t.setAttribute('font-weight', '600');
      t.setAttribute('fill', 'currentColor');
      t.textContent = '文本';
      svg.appendChild(t);
    }
    return svg;
  }

  function makeShapeButton(key, label, opts) {
    opts = opts || {};
    var btn = document.createElement('button');
    btn.className = 'shape-btn';
    btn.draggable = true;
    btn.dataset.shape = key;
    btn.title = '拖到画布，或点击添加到视图中央';
    btn.appendChild(shapeIcon(key));
    var span = document.createElement('span');
    span.textContent = label;
    btn.appendChild(span);
    btn.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData(opts.mime || 'text/fd-shape', opts.payload == null ? key : String(opts.payload));
      e.dataTransfer.setData('text/plain', key);
      e.dataTransfer.effectAllowed = 'copy';
      draggingShape = { key: key, overrides: opts.overrides || null, name: label };
    });
    btn.addEventListener('dragend', function () {
      el('dropVeil').hidden = true;
      draggingShape = null;
      view.setPreview([]);
    });
    btn.addEventListener('click', function () {
      if (opts.onClick) { opts.onClick(); return; }
      var pos = viewportCenterWorld();
      addShapeAt(key, pos.x, pos.y);
    });
    if (opts.onContextMenu) btn.addEventListener('contextmenu', opts.onContextMenu);
    return btn;
  }

  function buildPalette() {
    var list = el('shapeList');
    list.innerHTML = '';
    G.SHAPE_ORDER.forEach(function (key) { list.appendChild(makeShapeButton(key, G.getShape(key).name)); });
  }

  function viewportCenterWorld() {
    return {
      x: (wrap.clientWidth / 2 - state.view.x) / state.view.zoom,
      y: (wrap.clientHeight / 2 - state.view.y) / state.view.zoom
    };
  }

  function addShapeAt(key, wx, wy, overrides, silent) {
    var node = plannedNode(key, wx, wy, overrides);
    if (!silent) {
      store.addNode(node);
      store.selectNodes([node.id]);
      store.commit();
      render();
      msg('已添加「' + G.getShape(key).name + '」');
    }
    return node;
  }

  /** 计算新建组件最终会落在哪里（预览与真正创建走同一条计算，保证所见即所得）。 */
  function plannedNode(key, wx, wy, overrides) {
    var node = store.makeNode(key, wx, wy, overrides);
    if (state.settings.snapGrid) {
      var g = state.settings.gridSize;
      if (!overrides) {
        // 默认尺寸也取网格倍数，落到网格上时四条边都在网格线上
        node.w = Math.max(g, Math.ceil(node.w / g) * g);
        node.h = Math.max(g, Math.ceil(node.h / g) * g);
      }
      node.x = Math.round((wx - node.w / 2) / g) * g;
      node.y = Math.round((wy - node.h / 2) / g) * g;
    }
    return node;
  }

  /* ---------------- 自定义组件 ---------------- */

  function loadCustomShapes() {
    try {
      var raw = localStorage.getItem(STORAGE_SHAPES);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (err) { return []; }
  }

  function saveCustomShapes(arr) {
    try { localStorage.setItem(STORAGE_SHAPES, JSON.stringify(arr)); } catch (err) { /* 忽略 */ }
  }

  function buildCustomList() {
    var box = el('customList');
    var shapes = loadCustomShapes();
    box.innerHTML = '';
    el('customEmpty').hidden = shapes.length > 0;
    shapes.forEach(function (item, index) {
      var btn = makeShapeButton(item.shape, item.name, {
        mime: 'text/fd-custom',
        payload: index,
        onClick: function () {
          var pos = viewportCenterWorld();
          addShapeAt(item.shape, pos.x, pos.y, customOverrides(item));
        },
        onContextMenu: function (e) {
          e.preventDefault();
          var arr = loadCustomShapes();
          arr.splice(index, 1);
          saveCustomShapes(arr);
          buildCustomList();
          msg('已删除自定义组件');
        }
      });
      btn.dataset.custom = String(index);
      btn.title = '自定义组件：' + Math.round(item.w) + '×' + Math.round(item.h) + '（拖入或点击添加，右键删除）';
      box.appendChild(btn);
    });
  }

  function customOverrides(item) {
    return {
      w: item.w, h: item.h, text: item.text,
      style: JSON.parse(JSON.stringify(item.style))
    };
  }

  function saveCurrentAsCustom() {
    var node = store.selectedNodes()[0];
    if (!node) { msg('请先选中一个组件再保存', 'warn'); return; }
    var arr = loadCustomShapes();
    var name = (node.text || G.getShape(node.shape).name).slice(0, 6) || '自定义';
    arr.unshift({
      name: name, shape: node.shape, w: node.w, h: node.h, text: node.text,
      style: JSON.parse(JSON.stringify(node.style))
    });
    saveCustomShapes(arr.slice(0, 24));
    buildCustomList();
    msg('已保存自定义组件「' + name + '」');
  }

  /* ---------------- 自定义模板（整块复用框选内容） ---------------- */

  function loadTemplates() {
    try {
      var raw = localStorage.getItem(STORAGE_TEMPLATES);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (err) { return []; }
  }

  function saveTemplates(arr) {
    try { localStorage.setItem(STORAGE_TEMPLATES, JSON.stringify(arr)); } catch (err) { /* 忽略 */ }
  }

  function buildTemplateList() {
    var box = el('templateList');
    var list = loadTemplates();
    box.innerHTML = '';
    el('templateEmpty').hidden = list.length > 0;
    list.forEach(function (tpl, index) {
      var btn = document.createElement('button');
      btn.className = 'btn wide';
      btn.draggable = true;
      btn.dataset.templateIndex = String(index);
      btn.title = '点击插入到视图中央，或拖到画布指定位置；右键删除。共 ' +
        tpl.nodes.length + ' 个组件、' + tpl.edges.length + ' 条箭头';
      var label = document.createElement('span');
      label.className = 'tpl-name';
      label.textContent = tpl.name;
      var meta = document.createElement('em');
      meta.className = 'tpl-meta';
      meta.textContent = tpl.nodes.length + ' 个 / ' + tpl.edges.length + ' 条';
      btn.appendChild(label);
      btn.appendChild(meta);
      btn.addEventListener('click', function () {
        var pos = viewportCenterWorld();
        insertTemplate(tpl, pos.x, pos.y);
      });
      btn.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/fd-template', String(index));
        e.dataTransfer.effectAllowed = 'copy';
      });
      btn.addEventListener('dragend', function () { el('dropVeil').hidden = true; });
      btn.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        var arr = loadTemplates();
        arr.splice(index, 1);
        saveTemplates(arr);
        buildTemplateList();
        msg('已删除模板');
      });
      box.appendChild(btn);
    });
  }

  function saveSelectionAsTemplate() {
    var nodes = store.selectedNodes();
    if (nodes.length < 2) {
      msg('请先框选或按住 Shift 选中至少两个组件', 'warn');
      pill('先框选要复用的组件，再点「存为模板」', 3200);
      return;
    }
    var ids = nodes.map(function (n) { return n.id; });
    var edges = state.edges.filter(function (e) {
      return e.from.node && e.to.node &&
        ids.indexOf(e.from.node) >= 0 && ids.indexOf(e.to.node) >= 0;
    });
    var suggested = '模板 ' + (loadTemplates().length + 1);
    var name = null;
    try { name = window.prompt('给这个模板起个名字：', suggested); } catch (err) { name = suggested; }
    if (name === null) return;
    name = String(name || '').trim() || suggested;
    var arr = loadTemplates();
    arr.unshift({
      name: name.slice(0, 16),
      nodes: nodes.map(function (n) { return JSON.parse(JSON.stringify(n)); }),
      edges: edges.map(function (e) { return JSON.parse(JSON.stringify(e)); })
    });
    saveTemplates(arr.slice(0, 24));
    buildTemplateList();
    msg('已保存模板「' + name + '」：' + nodes.length + ' 个组件、' + edges.length + ' 条箭头');
  }

  /** 把模板整块插入画布，中心对齐到 (wx, wy)。 */
  /** 模板整块会落在哪里（预览与实际插入共用）。 */
  function plannedTemplate(tpl, wx, wy) {
    var box = G.unionRects(tpl.nodes);
    var ox = wx - (box.x + box.w / 2);
    var oy = wy - (box.y + box.h / 2);
    if (state.settings.snapGrid) {
      var g = state.settings.gridSize;
      ox = Math.round(ox / g) * g;
      oy = Math.round(oy / g) * g;
    }
    return {
      ox: ox, oy: oy,
      shapes: tpl.nodes.map(function (n) {
        return {
          shape: n.shape, x: n.x + ox, y: n.y + oy, w: n.w, h: n.h,
          radius: n.style ? n.style.radius : null
        };
      })
    };
  }

  function insertTemplate(tpl, wx, wy) {
    if (!tpl || !tpl.nodes || !tpl.nodes.length) return;
    var plan = plannedTemplate(tpl, wx, wy);
    var ox = plan.ox, oy = plan.oy;
    var map = {};
    var newNodes = [];
    tpl.nodes.forEach(function (raw) {
      var copy = JSON.parse(JSON.stringify(raw));
      var oldId = copy.id;
      copy.id = G.uid('n');
      copy.x = Math.round((copy.x + ox) * 100) / 100;
      copy.y = Math.round((copy.y + oy) * 100) / 100;
      map[oldId] = copy.id;
      store.addNode(copy);
      newNodes.push(copy.id);
    });
    var newEdges = [];
    (tpl.edges || []).forEach(function (raw) {
      var copy = JSON.parse(JSON.stringify(raw));
      copy.id = G.uid('e');
      if (copy.from.node && map[copy.from.node]) copy.from.node = map[copy.from.node];
      if (copy.to.node && map[copy.to.node]) copy.to.node = map[copy.to.node];
      if (copy.from.point) { copy.from.point.x += ox; copy.from.point.y += oy; }
      if (copy.to.point) { copy.to.point.x += ox; copy.to.point.y += oy; }
      store.addEdge(copy);
      newEdges.push(copy.id);
    });
    store.selectNodes(newNodes);
    store.selectEdges(newEdges, true);
    store.commit();
    render();
    msg('已插入模板「' + tpl.name + '」');
  }

  /* ---------------- 属性面板 ---------------- */

  function primaryNode() { return store.selectedNodes()[0] || null; }
  function primaryEdge() { return store.selectedEdges()[0] || null; }
  function eachSelectedNode(fn) { store.selectedNodes().forEach(fn); }

  function buildShapeOptions() {
    var sel = el('np-shape');
    sel.innerHTML = '';
    G.SHAPE_ORDER.forEach(function (key) {
      var o = document.createElement('option');
      o.value = key;
      o.textContent = G.getShape(key).name;
      sel.appendChild(o);
    });
  }

  function syncProps() {
    syncing = true;
    var node = primaryNode();
    var edge = primaryEdge();
    var multi = state.selection.nodes.length > 1;

    el('propsNone').hidden = !!node || !!edge;
    el('propsNode').hidden = !node;
    el('propsEdge').hidden = !node && !edge;

    if (node) {
      setVal('np-shape', node.shape);
      setVal('np-x', Math.round(node.x));
      setVal('np-y', Math.round(node.y));
      setVal('np-w', Math.round(node.w));
      setVal('np-h', Math.round(node.h));
      setVal('np-fill', toHex(node.style.fill) || '#ffffff');
      setVal('np-stroke', toHex(node.style.stroke) || '#3c4657');
      setVal('np-strokeWidth', node.style.strokeWidth);
      setVal('np-radius', node.style.radius == null ? 0 : Math.round(node.style.radius));
      setVal('np-dash', node.style.dash || '');
      setVal('np-fontSize', node.style.fontSize);
      setVal('np-fontColor', toHex(node.style.fontColor) || '#1f2733');
      setVal('np-align', node.style.align);
      el('np-lockRatio').checked = !!node.lockRatio;
      toggleClass('np-bold', node.style.bold);
      toggleClass('np-italic', node.style.italic);
      toggleClass('np-shadow', node.style.shadow);
      toggleClass('np-lock', node.locked);
      el('alignRow').style.opacity = multi ? '1' : '0.65';
    }
    if (edge) {
      setVal('ep-mode', edge.mode);
      setVal('ep-label', edge.label || '');
      setVal('ep-color', toHex(edge.style.color) || '#5d6779');
      setVal('ep-strokeWidth', edge.style.strokeWidth);
      setVal('ep-dash', edge.style.dash || '');
      setVal('ep-from-port', edge.from.node ? (edge.from.port || 'auto') : 'free');
      setVal('ep-to-port', edge.to.node ? (edge.to.port || 'auto') : 'free');
      toggleClass('ep-arrowEnd', edge.style.arrowEnd);
      toggleClass('ep-arrowStart', edge.style.arrowStart);
      var biMode = edge.style.biMode || 'none';
      toggleClass('ep-bi-none', biMode === 'none');
      toggleClass('ep-bi-overlap', biMode === 'overlap');
      toggleClass('ep-bi-separate', biMode === 'separate');
      var merged = biMode === 'overlap';
      var noneBtn = el('ep-bi-none');
      var canRevert = biMode === 'none' || edge.style.biAuto === true;
      noneBtn.disabled = !canRevert;
      noneBtn.title = canRevert
        ? '不做特殊处理：同向多根箭头自动错开，反向箭头自然重叠'
        : '两端都是你自己连的箭头，不能自动退回单向；想变单向请先删掉其中一根';
      el('ep-bi-tip').textContent = merged
        ? '这是一条双向箭头线（两端都有箭头）：选中、拖动、删除都是整体操作；选「分开」会拆成两条可分别删除的箭头。' +
          (canRevert ? '选「无」则退回原来那根单向箭头。' : '')
        : groupEdgesOf(edge).length > 1
          ? '同一对端口上有 ' + groupEdgesOf(edge).length + ' 根箭头，各自可单独删除：' +
            '选「分开」让它们并排（互不交叉），选「重合」合并成一条两端带箭头的双向箭头线。' +
            (canRevert ? '这两根是自动补出来的，选「无」会退回原来那根单向箭头。' : '两根都是你手动连的，所以「无」不可用。')
          : '当前是单向箭头：「重合」把它变成两端带箭头的双向箭头线，「分开」会补上反向那根并排显示。';
    }
    syncing = false;
  }

  function setVal(id, v) {
    var node = el(id);
    if (!node) return;
    if (node === document.activeElement) return;
    node.value = v;
  }

  function toggleClass(id, on) {
    var node = el(id);
    if (node) node.classList.toggle('on', !!on);
  }

  function toHex(color) {
    if (!color || color === 'none') return null;
    if (/^#[0-9a-f]{6}$/i.test(color)) return color.toLowerCase();
    if (/^#[0-9a-f]{3}$/i.test(color)) {
      return ('#' + color[1] + color[1] + color[2] + color[2] + color[3] + color[3]).toLowerCase();
    }
    var m = /^rgba?\(([^)]+)\)$/i.exec(color);
    if (m) {
      var parts = m[1].split(',').map(function (s) { return parseFloat(s); });
      return '#' + parts.slice(0, 3).map(function (v) {
        var h = Math.max(0, Math.min(255, Math.round(v))).toString(16);
        return h.length === 1 ? '0' + h : h;
      }).join('');
    }
    return null;
  }

  /* ---------------- 属性编辑绑定 ---------------- */

  function liveUpdate(fn, commitNow) {
    if (syncing) return;
    fn();
    render();
    if (commitNow) store.commit();
  }

  function bindNumber(id, apply) {
    var node = el(id);
    node.addEventListener('input', function () {
      var v = parseFloat(node.value);
      if (!isFinite(v)) return;
      liveUpdate(function () { apply(v); });
    });
    node.addEventListener('change', function () { store.commit(); syncProps(); });
  }

  function bindColor(id, apply) {
    var node = el(id);
    node.addEventListener('input', function () { liveUpdate(function () { apply(node.value); }); });
    node.addEventListener('change', function () { store.commit(); });
  }

  function bindSelect(id, apply) {
    var node = el(id);
    node.addEventListener('change', function () { liveUpdate(function () { apply(node.value); }, true); });
  }

  function bindToggle(id, apply) {
    var node = el(id);
    node.addEventListener('click', function () {
      liveUpdate(function () { apply(); }, false);
      store.commit();
      render();
    });
  }

  function eachEdgeStyle(key) {
    var value = arguments.length > 1 ? arguments[1] : arguments[0];
    store.selectedEdges().forEach(function (e) { e.style[key] = value; });
  }

  function applyStyleToSelected(key, value) {
    var nodes = store.selectedNodes();
    nodes.forEach(function (n) {
      if (key === 'radius' && !G.getShape(n.shape).radiusEditable) return;
      n.style[key] = value;
    });
  }

  function selectedNodeBBox() { return G.unionRects(store.selectedNodes()); }

  /* ---------------- 对齐 ---------------- */

  function alignSelection(mode) {
    var nodes = store.selectedNodes();
    if (nodes.length < 2) { msg('至少选择两个组件才能对齐', 'warn'); return; }
    var b = G.unionRects(nodes);
    if (mode === 'dist-h' || mode === 'dist-v') {
      distribute(nodes, mode === 'dist-h' ? 'h' : 'v');
    } else {
      nodes.forEach(function (n) {
        if (mode === 'left') n.x = b.x;
        else if (mode === 'right') n.x = b.x + b.w - n.w;
        else if (mode === 'hcenter') n.x = b.x + (b.w - n.w) / 2;
        else if (mode === 'top') n.y = b.y;
        else if (mode === 'bottom') n.y = b.y + b.h - n.h;
        else if (mode === 'vcenter') n.y = b.y + (b.h - n.h) / 2;
      });
    }
    store.commit();
    render();
  }

  function distribute(nodes, axis) {
    if (nodes.length < 3) { msg('等间距分布需要至少三个组件', 'warn'); return; }
    var key = axis === 'h' ? 'x' : 'y';
    var sizeKey = axis === 'h' ? 'w' : 'h';
    var sorted = nodes.slice().sort(function (a, b) { return a[key] - b[key]; });
    var start = sorted[0][key];
    var end = sorted[sorted.length - 1][key] + sorted[sorted.length - 1][sizeKey];
    var total = 0;
    sorted.forEach(function (n) { total += n[sizeKey]; });
    var gap = (end - start - total) / (sorted.length - 1);
    var cursor = start;
    sorted.forEach(function (n) {
      n[key] = Math.round(cursor * 100) / 100;
      cursor += n[sizeKey] + gap;
    });
  }

  function fitNodeToText(node) {
    var padX = 22, padY = 16;
    var lines = G.wrapText(node.text, 100000, node.style.fontSize, node.style.bold);
    var m = G.measureLines(lines, node.style.fontSize, node.style.bold);
    node.w = Math.max(40, Math.ceil(m.w + padX));
    node.h = Math.max(28, Math.ceil(m.h + padY));
  }

  /* ---------------- 指针交互 ---------------- */

  function bindDragEvents() {
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function unbindDragEvents() {
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
  }

  function onPointerDown(e) {
    if (e.button === 2) return;
    if (!el('contextMenu').hidden) { hideMenus(); if (e.button === 0) return; }
    if (editing) commitEdit(true);
    var pt = pointerWorld(e);
    var target = e.target;

    if (tool === 'pan' || spaceDown || e.button === 1) {
      drag = { type: 'pan', startScreen: pointerScreen(e), origin: { x: state.view.x, y: state.view.y } };
      setCursor('grabbing');
      bindDragEvents();
      e.preventDefault();
      return;
    }

    var anchorEl = closest(target, '[data-anchor]');
    if (anchorEl) {
      var anchorEdgeId = anchorEl.getAttribute('data-edge');
      drag = {
        type: 'edgeEnd', edgeId: anchorEdgeId,
        end: anchorEl.getAttribute('data-anchor'), target: null,
        offset: (R.edgeLayout(state.edges, store.nodeMap())[anchorEdgeId] || { offset: 0 }).offset
      };
      setCursor('crosshair');
      bindDragEvents();
      updateEdgeEnd(e);
      return;
    }

    var bendEl = closest(target, '[data-bend]');
    if (bendEl) {
      var bendEdgeId = bendEl.getAttribute('data-edge');
      var bendEdge = store.edgeById(bendEdgeId);
      drag = {
        type: 'bend', edgeId: bendEdgeId,
        axis: bendEl.getAttribute('data-bend'),
        group: bendEdge ? groupEdgesOf(bendEdge).map(function (item) { return item.id; }) : []
      };
      setCursor(drag.axis === 'x' ? 'ew' : 'ns');
      bindDragEvents();
      updateBend(e);
      return;
    }

    var labelEl = closest(target, '[data-label]');
    if (labelEl) {
      var labelEdgeId = labelEl.getAttribute('data-label');
      if (!store.isEdgeSelected(labelEdgeId)) store.selectEdges([labelEdgeId]);
      drag = { type: 'label', edgeId: labelEdgeId };
      setCursor('move');
      bindDragEvents();
      render();
      return;
    }

    var handleEl = closest(target, '[data-handle]');
    if (handleEl) {
      var hnode = store.nodeById(handleEl.getAttribute('data-node'));
      if (!hnode) return;
      drag = {
        type: 'resize', dir: handleEl.getAttribute('data-handle'), id: hnode.id,
        init: { x: hnode.x, y: hnode.y, w: hnode.w, h: hnode.h }
      };
      bindDragEvents();
      return;
    }

    var portEl = closest(target, '[data-port]');
    if (portEl) {
      startConnect(portEl.getAttribute('data-node'), portEl.getAttribute('data-port'), e);
      return;
    }

    var nodeEl = closest(target, '[data-node]');
    var edgeEl = closest(target, '[data-edge]');

    if (tool === 'connect') {
      if (nodeEl) {
        var n = store.nodeById(nodeEl.getAttribute('data-node'));
        var side = G.sideFromVector(pt.x - (n.x + n.w / 2), pt.y - (n.y + n.h / 2));
        startConnect(n.id, side, e);
      }
      return;
    }

    if (nodeEl) {
      var id = nodeEl.getAttribute('data-node');
      if (e.shiftKey) store.toggleNode(id);
      else if (!store.isNodeSelected(id)) store.selectNodes([id]);
      var node = store.nodeById(id);
      hoverId = id;
      if (node && store.isNodeSelected(id) && !node.locked && !e.altKey) startMove(e, id);
      render();
      return;
    }

    if (edgeEl) {
      var eid = edgeEl.getAttribute('data-edge');
      if (e.shiftKey) store.toggleEdge(eid);
      else store.selectEdges([eid]);
      render();
